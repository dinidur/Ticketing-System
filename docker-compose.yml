services:
  db:
    image: postgres:16-alpine
    container_name: ticketing-db
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs DB migrations once, then exits
  migrate:
    build: ./backend
    image: ticketing-backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://ticketing:ticketing@db:5432/ticketing
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: ticketing-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://ticketing:ticketing@db:5432/ticketing
      CORS_ORIGINS: '["http://localhost:8080", "http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
