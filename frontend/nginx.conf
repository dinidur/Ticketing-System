server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (same origin -> no CORS needed)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: unknown paths (e.g. /tickets/42) must return index.html
    location / {
        try_files $uri /index.html;
    }
}
